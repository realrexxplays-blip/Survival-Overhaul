name: Build NeoForge

on:
  workflow_dispatch:
  push:
    paths:
      - 'neoforge/**'
      - 'common/**'
      - '.github/workflows/build-neoforge.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '27'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.2'
      - name: Build NeoForge JAR
        working-directory: neoforge
        run: gradle build
      - uses: actions/upload-artifact@v4
        with:
          name: SurvivalOverhaul-NeoForge-1.21.1
          path: neoforge/build/libs/*.jar
